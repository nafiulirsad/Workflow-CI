name: CI ML Retrain and Build Docker

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  retrain-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow scikit-learn pandas numpy

      - name: Execute MLProject Retraining
        run: |
          mlflow run MLProject --no-conda -P n_estimators=100 -P max_depth=10

      - name: Find Latest MLflow Run ID
        id: get-run-id
        run: |
          # Find the directory with the latest modification time in mlruns/
          # MLflow creates directories named after experiment IDs, default is '0' or a long integer.
          # We search for the run directory inside mlruns/0/ or mlruns/*
          RUN_ID=$(ls -td mlruns/*/* 2>/dev/null | grep -v 'meta.yaml' | head -n 1 | xargs basename)
          if [ -z "$RUN_ID" ]; then
            # fallback search
            RUN_ID=$(find mlruns -maxdepth 2 -type d -not -path 'mlruns' -not -path 'mlruns/models' | grep -v 'meta.yaml' | head -n 1 | xargs basename)
          fi
          echo "Found Run ID: $RUN_ID"
          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Image using MLflow
        run: |
          # Search for where the model artifact is saved
          MODEL_PATH=$(find mlruns -name "model" -type d | head -n 1)
          echo "Model Path found: $MODEL_PATH"
          mlflow models build-docker -m "$MODEL_PATH" -n ghcr.io/${{ github.repository }}/bitcoin-predictor:latest

      - name: Push Docker Image to GHCR
        run: |
          docker push ghcr.io/${{ github.repository }}/bitcoin-predictor:latest
