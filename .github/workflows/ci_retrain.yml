name: CI ML Retrain and Build Docker

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.10"
  IMAGE_NAME: bitcoin-predictor

jobs:
  retrain-and-build:
    name: Test, Retrain and Publish Model Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: MLProject/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r MLProject/requirements.txt

      - name: Run unit tests
        working-directory: MLProject
        run: pytest

      - name: Execute MLProject retraining
        env:
          MLFLOW_TRACKING_URI: file://${{ github.workspace }}/mlruns
        run: |
          mlflow run MLProject --env-manager=local \
            --experiment-name Bitcoin_Price_Prediction_CI \
            -P n_estimators=100 \
            -P max_depth=10

      - name: Show training result
        run: |
          echo "Run ID: $(cat MLProject/run_id.txt)"
          cat MLProject/metrics.json
          echo "Exported model files:"
          ls -R MLProject/artifacts/model

      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-model
          path: |
            MLProject/artifacts/model
            MLProject/metrics.json
            MLProject/run_id.txt
          retention-days: 30

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: MLProject
          file: MLProject/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Print published image reference
        if: github.event_name != 'pull_request'
        run: |
          echo "Image pushed: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest"
